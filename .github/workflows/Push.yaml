name: Indy Plenum - Push Workflow
on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '.github/**'
      - 'Dockerfile'
      - 'Dockerfile.base'
      - 'bump_version.sh'

env:
  BASE_IMAGE: ghcr.io/hyperledger/indy-plenum-base
  PROD_IMAGE: ghcr.io/hyperledger/indy-plenum

jobs:
  docker-build-base:
    name: Build Base Image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build base image
        run: docker build -f Dockerfile.base -t ${{ env.BASE_IMAGE }}:latest .
      - name: Push base image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.BASE_IMAGE }}:latest

  docker-build:
    name: Build Production Image
    needs: [docker-build-base]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f Dockerfile -t ${{ env.PROD_IMAGE }}:latest .
      - name: Push production image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.PROD_IMAGE }}:latest

  plenum_tests:
    name: Test Plenum
    needs: [docker-build]
    uses: ./.github/workflows/reuseable_test.yaml
    with:
      image_tag: ${{ env.PROD_IMAGE }}:latest
