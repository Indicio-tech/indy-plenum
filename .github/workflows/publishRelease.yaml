name: Triggered by Version Bump merged

on:
  push:
    branches-ignore:
      - update-rc-version
      - update-version
    paths:
      - '!**'
      - "plenum/__version__.json"

permissions:
  contents: write
  pull-requests: write

env:
  BASE_IMAGE: ghcr.io/hyperledger/indy-plenum-base
  PROD_IMAGE: ghcr.io/hyperledger/indy-plenum

jobs:
  release-infos:
    name: release-infos
    runs-on: ubuntu-latest
    outputs:
      isVersionBump: ${{ steps.get-release-info.outputs.isVersionBump }}
      isPreRelease: ${{ steps.get-release-info.outputs.isRC }}
      versionTag: ${{ steps.get-release-info.outputs.versionTag }}
      version: ${{ steps.get-release-info.outputs.version }}
      component: ${{ steps.get-release-info.outputs.component }}
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      - name: get-release-info
        id: get-release-info
        uses: Indicio-tech/indy-shared-gha/.github/actions/get-release-info@v2
        with:
          versionString: "${{ github.event.head_commit.message }}"

  createRelease:
    name: Create Release
    needs: [release-infos]
    if: needs.release-infos.outputs.isVersionBump == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and tag base image
        run: |
          docker build -f Dockerfile.base \
            -t ${{ env.BASE_IMAGE }}:${{ needs.release-infos.outputs.versionTag }} \
            -t ${{ env.BASE_IMAGE }}:latest .

      - name: Build and tag production image
        run: |
          docker build -f Dockerfile \
            -t ${{ env.PROD_IMAGE }}:${{ needs.release-infos.outputs.versionTag }} \
            -t ${{ env.PROD_IMAGE }}:latest .

      - name: Push base image
        run: |
          docker push ${{ env.BASE_IMAGE }}:${{ needs.release-infos.outputs.versionTag }}
          docker push ${{ env.BASE_IMAGE }}:latest

      - name: Push production image
        run: |
          docker push ${{ env.PROD_IMAGE }}:${{ needs.release-infos.outputs.versionTag }}
          docker push ${{ env.PROD_IMAGE }}:latest

      - name: Generate Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-infos.outputs.VERSIONTAG }}
          generate_release_notes: true
          body: |
            [${{ needs.release-infos.outputs.VERSIONTAG }}]

            Docker images:
            - `${{ env.PROD_IMAGE }}:${{ needs.release-infos.outputs.versionTag }}`
            - `${{ env.PROD_IMAGE }}:latest`
          prerelease: ${{ needs.release-infos.outputs.isPreRelease }}
          target_commitish: ${{ github.event.ref }}
          name: "${{ needs.release-infos.outputs.VERSIONTAG }}"
          token: ${{ secrets.BOT_PR_PAT }}

  convertPyVersion:
    name: "Convert to python version flavour"
    needs: [release-infos, createRelease]
    uses: Indicio-tech/indy-shared-gha/.github/workflows/pyVersionConversion.yaml@v2
    with:
      VERSIONTAG: ${{ needs.release-infos.outputs.VERSIONTAG }}

  triggerNodeUpdate:
    runs-on: ubuntu-latest
    needs: [release-infos, createRelease, convertPyVersion]
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BOT_PR_PAT }}
          repository: hyperledger/indy-node
          event-type: update-node
          client-payload: '{"dockerTag": "${{ needs.release-infos.outputs.versionTag }}", "email":"${{ github.event.pusher.email }}"}'
